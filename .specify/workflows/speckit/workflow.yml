schema_version: "1.0"
workflow:
  id: "speckit"
  name: "Ciclo SDD completo"
  version: "1.0.1"
  author: "GitHub"
  description: "Ejecuta specify → plan → tasks → implement con puertas de revisión"

requires:
  # 0.8.5 es la primera versión que resuelve del lado del motor el valor por defecto
  # ``integration: "auto"``. Las versiones anteriores tratarían "auto"
  # como una clave de integración literal y fallarían al despachar.
  speckit_version: ">=0.8.5"
  integrations:
    # Los cuatro comandos de abajo (specify, plan, tasks, implement) son comandos
    # centrales de spec-kit que ofrece toda integración. La lista de acá es una
    # pista de compatibilidad orientativa y no exhaustiva, según el esquema
    # documentado ``any: [...]``: NO es un conjunto cerrado. El workflow corre
    # con cualquier integración con la que se haya inicializado el proyecto, incluso
    # las que no figuran abajo, siempre que esa integración ofrezca los cuatro
    # comandos centrales a los que hace referencia ``steps``.
    any:
      - "alquimia"
      - "claude"
      - "copilot"
      - "gemini"
      - "opencode"

inputs:
  spec:
    type: string
    required: true
    prompt: "Describí lo que querés construir"
  integration:
    type: string
    default: "auto"
    prompt: "Integración a usar (ej.: claude, copilot, gemini; 'auto' usa la integración con la que se inicializó el proyecto)"

steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-spec
    type: gate
    message: "Revisá la spec generada antes de planificar."
    options: [approve, reject]
    on_reject: abort

  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: review-plan
    type: gate
    message: "Revisá el plan antes de generar las tareas."
    options: [approve, reject]
    on_reject: abort

  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"

  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"
